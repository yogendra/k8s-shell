name: Build and Publish (GUI)
"on":
  push:
    paths:
      - k8s-gui-shell/
      - _common/
      - .github/workflows/k8s-gui-shell*
    branches:
      - main
    tags:
      - "gui-v*"
  pull_request:
    paths:
      - k8s-gui-shell/
      - _common/
      - .github/workflows/k8s-gui-shell*
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # This lives in the same repo as k8s-shell (github.repository is
  # yogendra-avgo/k8s-shell for both), so the image name must be set
  # explicitly here rather than derived from github.repository, or it would
  # collide with k8s-shell's own ghcr.io image.
  IMAGE: ghcr.io/${{ github.repository_owner }}/k8s-gui-shell

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Task CLI
        id: cache-task
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/task
          key: ${{ runner.os }}-task-v3.38.0      
      - name: Install Task CLI if missing from cache
        if: steps.cache-task.outputs.cache-hit != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin v3.38.0
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build (native arch, loaded locally)
        run: task -d k8s-gui-shell build IMAGE=${{ env.IMAGE }}
      - name: Smoke test bundled tools
        run: task -d k8s-gui-shell smoke IMAGE=${{ env.IMAGE }}

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Task
        uses: arduino/setup-task@v3
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker Image Tag
        run: |
          # Get current date in YYYYMM format
          DATE=$(date +'%Y%m')
          
          # Combine into the requested format
          TAG="v${DATE}-${{ github.run_number }}-${{ github.run_attempt }}"
          
          # Save to GITHUB_ENV so subsequent steps can use it
          echo "IMGTAG=$TAG" >> $GITHUB_ENV
      - name: Publish :latest
        run: task -d k8s-gui-shell publish IMAGE=${{ env.IMAGE }} TAG=latest
      - name: Publish :sha-<short-sha>
        run: task -d k8s-gui-shell publish IMAGE=${{ env.IMAGE }} TAG=sha-${{ github.sha }}
      - name: Publish :<date-tag>
        run: task -d k8s-gui-shell publish IMAGE=${{ env.IMAGE }} TAG=$IMGTAG
      - name: Get published digest
        if: github.ref == 'refs/heads/main'
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect ${{ env.IMAGE }}:latest --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Update deployment.yaml with published image digest
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i -E "s#(${{ env.IMAGE }}:).+?#\1:$IMGTAG#g" k8s-gui-shell/k8s/deployment.yaml
      - name: Commit and push updated deployment.yaml
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- k8s-gui-shell/k8s/deployment.yaml; then
            echo "deployment.yaml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s-gui-shell/k8s/deployment.yaml
          git commit -m "chore: update k8s-gui-shell image digest to $IMGTAG [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main (attempt $i)..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries"
          exit 1
