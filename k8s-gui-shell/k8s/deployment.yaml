---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-gui-shell
spec: {}
status: {}
---
# A standing k8s-gui-shell desktop you reach over a browser:
#   kubectl apply -f k8s/deployment.yaml k8s/rbac.yaml
#   kubectl --context <ctx> port-forward -n k8s-gui-shell deploy/k8s-gui-shell 3001:3001
#   open https://localhost:3001
#
# Unlike k8s-shell, this image does NOT run with readOnlyRootFilesystem or a
# dropped-capabilities securityContext by default: the XFCE desktop, D-Bus,
# PulseAudio, and the base image's own s6-overlay init all expect a writable
# root filesystem. /config is webtop's own persistent-data convention (see
# k8s-gui-shell/README.md) - mount a PVC there if you want desktop state
# (browser profile, terminal history, ...) to survive pod restarts; a plain
# emptyDir (as used here) is fine for a disposable/ephemeral shell.
#
# The mounted ServiceAccount token (see k8s/rbac.yaml, applied alongside this
# file) lets packaging/custom-cont-init.d/10-kubeconfig.sh generate an
# in-cluster kubeconfig on startup, so kubectl/helm/k9s/stern work against
# this cluster with no extra setup.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-gui-shell
  namespace: k8s-gui-shell
  labels:
    app.kubernetes.io/name: k8s-gui-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-gui-shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-gui-shell
    spec:
      serviceAccountName: k8s-gui-shell-sa
      containers:
        - name: k8s-gui-shell
          image: ghcr.io/yogendra-avgo/k8s-gui-shell:latest@v202608-3-1@v202608-31941729663-1
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: https
              containerPort: 3001
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-gui-shell
  namespace: k8s-gui-shell
spec:
  selector:
    app.kubernetes.io/name: k8s-gui-shell
  ports:
    - name: https
      port: 3001
      targetPort: 3001
    - name: http
      port: 3000
      targetPort: 3000
